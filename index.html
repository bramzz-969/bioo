<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#10101a">
<meta name="description" content="Bramzz Development — personal link page.">
<title>Bramzz — Links</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

:root {
  --bg: #0b0b14;
  --panel: rgba(25, 22, 38, .62);
  --panel-2: rgba(255,255,255,.075);
  --text: #f8f7fb;
  --muted: #b8b2c5;
  --purple: #9a82d8;
  --lavender: #c8b7ff;
  --pink: #d99bb8;
  --blue: #8e9fd2;
  --line: rgba(255,255,255,.13);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: Inter, system-ui, sans-serif;
  color: var(--text);
  background:
    radial-gradient(circle at 15% 15%, rgba(150,125,215,.20), transparent 30%),
    radial-gradient(circle at 85% 25%, rgba(220,150,190,.16), transparent 28%),
    radial-gradient(circle at 50% 100%, rgba(100,120,190,.16), transparent 35%),
    var(--bg);
  overflow-x: hidden;
}

body::before {
  content:"";
  position: fixed;
  inset: 0;
  z-index: -3;
  background:
    linear-gradient(125deg, rgba(155,135,215,.08), transparent 40%),
    linear-gradient(315deg, rgba(215,155,185,.07), transparent 45%);
  pointer-events: none;
}

.noise {
  position: fixed; inset: 0; z-index: -1; pointer-events:none; opacity:.055;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E");
}

.orb {
  position: fixed;
  width: 280px; height: 280px; border-radius: 50%;
  filter: blur(70px);
  opacity: .25;
  pointer-events: none;
  z-index: -2;
  animation: float 10s ease-in-out infinite alternate;
}
.orb.one { background:#9c82dc; top:8%; left:-90px; }
.orb.two { background:#d697bb; right:-100px; top:42%; animation-delay:-3s; }
.orb.three { background:#7e91c9; bottom:-100px; left:35%; animation-delay:-6s; }

@keyframes float {
  to { transform: translate3d(45px,-35px,0) scale(1.12); }
}

.page {
  width: min(100% - 28px, 620px);
  margin: 0 auto;
  padding: 54px 0 30px;
}

.profile {
  text-align: center;
  animation: rise .8s cubic-bezier(.2,.8,.2,1) both;
}

.avatar-wrap {
  position: relative;
  width: 112px; height: 112px;
  margin: 0 auto 17px;
}
.avatar-ring {
  position:absolute; inset:-5px;
  border-radius: 50%;
  background: conic-gradient(from 0deg, #bca6ff, #d99dbd, #8296d2, #bca6ff);
  animation: spin 7s linear infinite;
  filter: drop-shadow(0 0 18px rgba(184,158,255,.28));
}
.avatar {
  position: relative;
  width: 100%; height: 100%;
  border-radius: 50%;
  object-fit: cover;
  border: 4px solid #11111b;
  display:block;
}
@keyframes spin { to { transform: rotate(360deg); } }

.username {
  font-size: clamp(25px, 7vw, 34px);
  font-weight: 800;
  letter-spacing: -.05em;
  margin: 0;
}
.handle {
  color: var(--muted);
  margin: 7px 0 0;
  font-size: 14px;
}

.status {
  display:inline-flex; align-items:center; gap:7px;
  margin-top:14px;
  padding:8px 12px;
  border:1px solid var(--line);
  border-radius:999px;
  background:rgba(255,255,255,.045);
  backdrop-filter: blur(14px);
  color:#d8d2df;
  font-size:12px;
}
.dot {
  width:7px; height:7px; border-radius:50%;
  background:#bba7ff;
  box-shadow:0 0 12px #bba7ff;
  animation:pulse 1.7s infinite;
}
@keyframes pulse { 50% { opacity:.4; transform:scale(.75); } }

.links {
  margin-top: 30px;
  display: grid;
  gap: 13px;
}

.link-card {
  --mx: 50%; --my: 50%;
  position:relative;
  display:flex;
  align-items:center;
  min-height:72px;
  padding: 12px 17px;
  color:var(--text);
  text-decoration:none;
  border:1px solid var(--line);
  border-radius:20px;
  background:
    radial-gradient(circle at var(--mx) var(--my), rgba(208,190,255,.18), transparent 32%),
    linear-gradient(135deg, rgba(255,255,255,.085), rgba(255,255,255,.035));
  backdrop-filter: blur(18px);
  box-shadow: 0 12px 35px rgba(0,0,0,.18);
  overflow:hidden;
  transform: translateY(20px);
  opacity:0;
  animation: cardIn .65s cubic-bezier(.2,.8,.2,1) forwards;
  transition: transform .35s cubic-bezier(.2,.8,.2,1), border-color .35s, box-shadow .35s;
}
.link-card:nth-child(1) { animation-delay:.18s; }
.link-card:nth-child(2) { animation-delay:.28s; }
.link-card:nth-child(3) { animation-delay:.38s; }
.link-card:nth-child(4) { animation-delay:.48s; }
.link-card:nth-child(5) { animation-delay:.58s; }

@keyframes cardIn { to { transform:translateY(0); opacity:1; } }

.link-card::before {
  content:"";
  position:absolute;
  top:0; left:-120%;
  width:70%; height:100%;
  background:linear-gradient(100deg, transparent, rgba(255,255,255,.12), transparent);
  transform:skewX(-18deg);
  transition:left .7s ease;
}
.link-card:hover::before { left:150%; }
.link-card:hover {
  transform: translateY(-4px) scale(1.012);
  border-color:rgba(210,193,255,.38);
  box-shadow:0 18px 45px rgba(0,0,0,.28), 0 0 25px rgba(170,145,230,.09);
}

.icon {
  width:46px; height:46px; flex:0 0 46px;
  display:grid; place-items:center;
  border-radius:15px;
  background:rgba(255,255,255,.075);
  border:1px solid rgba(255,255,255,.10);
  font-size:21px;
  margin-right:14px;
  transition:transform .35s, background .35s;
}
.link-card:hover .icon { transform:rotate(-4deg) scale(1.07); background:rgba(196,176,255,.13); }

.info { min-width:0; flex:1; }
.title { display:block; font-weight:700; font-size:15px; }
.desc { display:block; color:var(--muted); font-size:11px; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.arrow {
  width:34px; height:34px; display:grid; place-items:center;
  color:#cfc6da; font-size:18px;
  transition:transform .35s, color .35s;
}
.link-card:hover .arrow { transform:translateX(4px); color:#fff; }

.footer {
  text-align:center;
  margin-top:35px;
  color:#898393;
  font-size:11px;
  letter-spacing:.02em;
  animation: rise 1s .55s both;
}
.footer b { color:#c8b9e7; }

.tip {
  margin:14px auto 0;
  max-width:420px;
  color:#777282;
  font-size:10px;
}

@keyframes rise {
  from { opacity:0; transform:translateY(18px); }
  to { opacity:1; transform:translateY(0); }
}

@media (max-width:480px) {
  .page { padding-top:40px; width:min(100% - 22px, 620px); }
  .link-card { min-height:68px; border-radius:18px; }
  .avatar-wrap { width:100px; height:100px; }
}
</style>
</head>
